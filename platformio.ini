; SLAM-машинка "mapper" на ESP32-S3-DevKitC-1 N16R8
; Схема подключения: docs/wiring.png

[platformio]
default_envs = mapper

[env:mapper]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi    ; QIO flash + OPI PSRAM
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Serial через встроенный USB

monitor_speed = 115200
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
lib_deps = bblanchon/ArduinoJson@^7

; Прошивка по Wi-Fi (машинка должна быть в сети): pio run -e mapper-ota -t upload
[env:mapper-ota]
extends = env:mapper
upload_protocol = espota
upload_port = mapper.local
upload_flags = --host_port=3233   ; фиксированный порт: sudo ufw allow 3233/tcp

; Тест датчиков без компа: ESP поднимает Wi-Fi "mapper-test" (12345678) → http://192.168.4.1
; pio run -e sensortest -t upload
[env:sensortest]
extends = env:mapper
build_flags = ${env:mapper.build_flags} -DSENSOR_TEST
build_src_filter = -<*> +<hw.cpp> +<tof.cpp> +<sensortest.cpp>

; Простой тест ультразвуков: pio run -e ustest -t upload
[env:ustest]
extends = env:mapper
build_flags = ${env:mapper.build_flags} -DUS_TEST
build_src_filter = -<*> +<ustest.cpp> +<hw.cpp> +<tof.cpp>

; Тест ходовой: WASD со страницы http://mapper.local, прямой ШИМ без энкодеров
[env:drivetest]
extends = env:mapper
build_flags = ${env:mapper.build_flags} -DDRIVE_TEST
build_src_filter = -<*> +<hw.cpp> +<drivetest.cpp>

[env:drivetest-ota]
extends = env:drivetest
upload_protocol = espota
upload_port = mapper.local
upload_flags = --host_port=3233
